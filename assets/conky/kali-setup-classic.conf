-- assets/conky/kali-setup-classic.conf — классический текстовый Conky (в духе
-- конфига brenden из вики Conky): моноширинный шрифт, пунктирные разделители,
-- полосы, градиентные графики сети и топ процессов.
-- Сетевые интерфейсы, VPN, датчик температуры и разделы дисков ищутся при запуске;
-- заметки берёт kali-setup-classic.lua из ~/notes.txt.
-- Запуск: conky -c assets/conky/kali-setup-classic.conf

local function exists(p) local f = io.open(p, 'r'); if f then f:close() end; return f ~= nil end
local function read(p) local f = io.open(p, 'r'); if not f then return nil end; local s = f:read('*l'); f:close(); return s end

-- Помощник заметок лежит рядом с конфигом. lua_load не понимает пробелы в пути
-- (например, запуск прямо из «~/new pc/…»), тогда кладём копию в $XDG_RUNTIME_DIR.
-- Не нашёлся — виджет работает без блока заметок.
local helper = (debug.getinfo(1, 'S').source:match('^@(.*/)') or './') .. 'kali-setup-classic.lua'
if helper:find('%s') then
    local src, run = io.open(helper, 'rb'), os.getenv('XDG_RUNTIME_DIR') or '/tmp'
    helper = nil
    if src and not run:find('%s') then
        local dst = io.open(run .. '/kali-setup-classic.lua', 'wb')
        if dst then dst:write(src:read('*a')); dst:close(); helper = run .. '/kali-setup-classic.lua' end
    end
    if src then src:close() end
end
if helper and not exists(helper) then helper = nil end
local function ls(p)
    local out, h = {}, io.popen('ls -1 ' .. p .. ' 2>/dev/null')
    if h then for l in h:lines() do out[#out + 1] = l end; h:close() end
    return out
end

-- Интерфейсы: обычные (с графиками) и VPN (только адрес)
local VPN_PAT = { '^tun', '^wg', '^amn', '^tap', '^happ', '^tailscale', '^proton', '^nordlynx' }
local SKIP_PAT = { '^lo$', '^docker', '^veth', '^br%-', '^virbr', '^vmnet', '^vboxnet' }
local function match_any(s, pats) for _, p in ipairs(pats) do if s:match(p) then return true end end end

local ifaces, vpns = {}, { tun0 = true, wg0 = true, amn0 = true }   -- эти могут появиться позже
for _, i in ipairs(ls('/sys/class/net')) do
    if match_any(i, VPN_PAT) then vpns[i] = true
    elseif not match_any(i, SKIP_PAT) then ifaces[#ifaces + 1] = i end
end
local vpn_list = {}
for i in pairs(vpns) do vpn_list[#vpn_list + 1] = i end
table.sort(vpn_list)

local net = {}
for _, i in ipairs(ifaces) do
    local wifi = exists('/sys/class/net/' .. i .. '/wireless')
    net[#net + 1] = table.concat({
        '${if_up ' .. i .. '}\n${color0} ' .. i .. '${color4}'
            .. (wifi and (' ${wireless_essid ' .. i .. '} ${wireless_link_qual_perc ' .. i .. '}%') or '')
            .. '${alignr}${color}${addr ' .. i .. '}',
        '  Down:${color2} ${downspeed ' .. i .. '}${color}${goto 186}Up:${color2} ${upspeed ' .. i .. '}${color}',
        '${downspeedgraph ' .. i .. ' 32,160 ff0000 0000ff}${alignr}${upspeedgraph ' .. i .. ' 32,160 0000ff ff0000}',
        '${color4}  Total: ${totaldown ' .. i .. '}${goto 186}Total: ${totalup ' .. i .. '}${color}${endif}',
    }, '\n')
end

-- VPN: первый поднятый из списка, иначе «off»
local vpn = '${color4}off${color}'
for k = #vpn_list, 1, -1 do
    local i = vpn_list[k]
    vpn = '${if_up ' .. i .. '}${color1}' .. i .. '${alignr}${color}${addr ' .. i .. '}${else}' .. vpn .. '${endif}'
end

-- Температура CPU (если есть датчик; в виртуалке обычно нет)
local temp = ''
for _, h in ipairs(ls('/sys/class/hwmon')) do
    local name = read('/sys/class/hwmon/' .. h .. '/name')
    if name and match_any(name, { '^coretemp$', '^k10temp$', '^zenpower$', '^cpu_thermal$', '^acpitz$' }) then
        temp = 'Temperature:${goto 112}CPU:${color0} ${hwmon ' .. h:match('%d+') .. ' temp 1}°C${color}\n'
        break
    end
end

-- Батарея (ноутбук)
local bat = ''
for _, b in ipairs(ls('/sys/class/power_supply')) do
    if b:match('^BAT') and tonumber(read('/sys/class/power_supply/' .. b .. '/capacity') or '') then   -- у VM батарея-заглушка без ёмкости
        bat = 'Battery:${goto 112}${color0}${battery_short ' .. b .. '} ${color}${battery_bar 6 ' .. b .. '}\n'
        break
    end
end

-- Разделы: корень и /home, если он отдельный
local fs = { '/' }
for l in io.lines('/proc/mounts') do
    if l:match('^%S+ /home ') then fs[#fs + 1] = '/home' end
end
local fs_lines = {}
for _, m in ipairs(fs) do
    fs_lines[#fs_lines + 1] = ' ' .. m .. '${goto 60}${color0}${fs_used ' .. m .. '}/${fs_size ' .. m .. '}${color} ${fs_bar 6 ' .. m .. '}'
end

conky.config = {
    alignment = 'top_right', gap_x = 30, gap_y = 60,
    own_window = true, own_window_type = 'desktop', own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false, own_window_colour = '#d00b0b0f',   -- AARRGGBB: полупрозрачный чёрный
    double_buffer = true, update_interval = 1, cpu_avg_samples = 2, net_avg_samples = 2,
    minimum_width = 340, maximum_width = 340, border_inner_margin = 12,
    use_xft = true, xftalpha = 1,
    font = 'JetBrains Mono,DejaVu Sans Mono:pixelsize=12',   -- в пикселях: вёрстка (goto) не зависит от DPI
    override_utf8_locale = true, uppercase = false, draw_shades = false,
    draw_outline = false, draw_borders = false, draw_graph_borders = false,
    stippled_borders = 3, default_bar_width = 0, default_bar_height = 6,
    short_units = true, pad_percents = 2, top_name_width = 15, top_name_verbose = false,
    default_color = 'd8d8d8',
    color0 = 'ffffff',   -- значения
    color1 = 'ddaa00',   -- выделение (верхний процесс, VPN, заголовки заметок)
    color2 = '5ab4ff',   -- скорость сети
    color3 = '8a4dff',   -- CPU
    color4 = '707070',   -- приглушённый текст
    lua_load = helper,
};

conky.text = table.concat({
    '${color0}${nodename}${color} - ${sysname} ${kernel} on ${machine}',
    '${color4}${stippled_hr}${color}',
    'Uptime:${color0} ${uptime_short}${color} - Load:${color0} ${loadavg}${color}',
    'CPU Usage:${color3} ${cpu}% ${cpubar 6}',
    '${cpugraph 30,0 1a0a33 8a4dff}${color}',
    'RAM Usage:${color0} ${mem}/${memmax} - ${memperc}%${color} ${membar 6}',
    'Swap Usage:${color0} ${swap}/${swapmax} - ${swapperc}%${color} ${swapbar 6}',
    'Processes:${color0} ${processes}${color}  Running:${color0} ${running_processes}${color}',
    '${color4}${stippled_hr}${color}',
    'Networking:' .. table.concat(net, ''),
    'VPN:${goto 112}' .. vpn,
    'External IP:${goto 112}${color0}${execi 900 curl -s --max-time 4 https://api.ipify.org}${color}',
    '${color4}${stippled_hr}${color}',
    'File systems:',
    table.concat(fs_lines, '\n'),
    temp .. bat .. '${color4}${stippled_hr}${color}',
    '${color}Name${goto 146}PID${goto 206}CPU%${goto 270}MEM%',
    '${color1} ${top name 1}${goto 146}${top pid 1}${goto 206}${top cpu 1}${goto 270}${top mem 1}',
    '${color} ${top name 2}${goto 146}${top pid 2}${goto 206}${top cpu 2}${goto 270}${top mem 2}',
    '${color} ${top name 3}${goto 146}${top pid 3}${goto 206}${top cpu 3}${goto 270}${top mem 3}',
    '${color} ${top name 4}${goto 146}${top pid 4}${goto 206}${top cpu 4}${goto 270}${top mem 4}',
    'Mem usage',
    '${color1} ${top_mem name 1}${goto 146}${top_mem pid 1}${goto 206}${top_mem cpu 1}${goto 270}${top_mem mem 1}',
    '${color} ${top_mem name 2}${goto 146}${top_mem pid 2}${goto 206}${top_mem cpu 2}${goto 270}${top_mem mem 2}',
    '${color} ${top_mem name 3}${goto 146}${top_mem pid 3}${goto 206}${top_mem cpu 3}${goto 270}${top_mem mem 3}',
}, '\n') .. (helper and '\n${color4}${stippled_hr}${color}\nNotes:\n${lua_parse notes}${color}' or '');
